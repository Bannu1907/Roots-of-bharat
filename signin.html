<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Roots of Bharat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-art" aria-label="Roots of Bharat welcome">
    <img src="./assets/roots-of-bharat-hero.png" alt="Indian heritage illustration">
    <a class="brand auth-brand" href="index.html">
      <span class="brand-mark">RB</span>
      <span>
        <strong>Roots of Bharat</strong>
        <small>Cultural atlas of India</small>
      </span>
    </a>
  </section>

  <section class="auth-panel" aria-labelledby="signin-title">
    <p class="eyebrow">Demo account</p>
    <h1 id="signin-title">Sign in</h1>
    <p class="auth-note">Use these sample details for the prototype.</p>

    <form class="auth-form">
      <label>
        <span>Email</span>
        <input type="email" value="demo@rootsofbharat.in">
      </label>
      <label>
        <span>Password</span>
        <input type="password" value="heritage123">
      </label>
      <label class="remember-row">
        <input type="checkbox" checked>
        <span>Remember this demo user</span>
      </label>
      <a class="form-submit" href="explore.html">Sign in to explore</a>
    </form>

    <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
  </section>
</main>
</body>
</html>
