<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Roots of Bharat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-art" aria-label="Roots of Bharat welcome">
    <img src="./assets/roots-of-bharat-hero.png" alt="Indian heritage illustration">
    <a class="brand auth-brand" href="index.html">
      <span class="brand-mark">RB</span>
      <span>
        <strong>Roots of Bharat</strong>
        <small>Cultural atlas of India</small>
      </span>
    </a>
  </section>

  <section class="auth-panel" aria-labelledby="signup-title">
    <p class="eyebrow">Create profile</p>
    <h1 id="signup-title">Sign up</h1>
    <p class="auth-note">Demo fields for a future user profile and saved heritage trails.</p>

    <form class="auth-form">
      <label>
        <span>Full name</span>
        <input type="text" value="Aarav Sharma">
      </label>
      <label>
        <span>Email</span>
        <input type="email" value="aarav@example.com">
      </label>
      <label>
        <span>Interest</span>
        <select>
          <option>Temples and sacred places</option>
          <option>Food heritage</option>
          <option>Dance, music, and crafts</option>
          <option>History and monuments</option>
        </select>
      </label>
      <label>
        <span>Password</span>
        <input type="password" value="heritage123">
      </label>
      <a class="form-submit" href="explore.html">Create demo account</a>
    </form>

    <p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p>
  </section>
</main>
</body>
</html>
